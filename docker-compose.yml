services:
  omniagent:
    build: .
    env_file: .env
    environment:
      OMNI_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - omni-data:/app/data
    restart: unless-stopped
  dashboard:
    build: .
    env_file: .env
    environment:
      OMNI_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - omni-data:/app/data
    command: ["streamlit", "run", "api/dashboard.py", "--server.address=0.0.0.0"]

volumes:
  omni-data:
